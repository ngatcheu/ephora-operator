---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: previewenvironments.ephora.io
spec:
  group: ephora.io
  names:
    kind: PreviewEnvironment
    listKind: PreviewEnvironmentList
    plural: previewenvironments
    shortNames:
    - penv
    singular: previewenvironment
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.prNumber
      name: PR
      type: integer
    - jsonPath: .status.namespace
      name: Namespace
      type: string
    - jsonPath: .status.expiresAt
      name: Expires
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: PreviewEnvironment is the Schema for the previewenvironments
          API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PreviewEnvironmentSpec defines the desired state of a PreviewEnvironment.
            properties:
              appName:
                description: |-
                  AppName is the application name, combined with PRNumber to derive the
                  namespace `preview-pr-<prNumber>-<appName>` (lowercase, RFC 1123 label).
                maxLength: 40
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              prNumber:
                description: |-
                  PRNumber is the Pull Request number this environment belongs to. It is
                  immutable after creation because it (with AppName) derives the
                  namespace name — changing it would orphan the original namespace.
                format: int32
                minimum: 1
                type: integer
                x-kubernetes-validations:
                - message: prNumber is immutable
                  rule: self == oldSelf
              source:
                description: Source identifies the Git repository, chart path and
                  revision to deploy.
                properties:
                  chartPath:
                    description: ChartPath is the path to the chart within the repository.
                    minLength: 1
                    type: string
                  repo:
                    description: |-
                      Repo is the Git repository URL hosting the application's Helm chart.
                      Restricted to allow-listed internal Git hosts (DAT §3.1, §5) so a CRD
                      can never point the operator at an unvetted external repository.

                      NOTE: adjust this pattern to your organization's real internal Git
                      host(s) before going to production — the default only matches the
                      placeholder hosts used in the DAT/README examples.
                    pattern: ^https://(gitlab\.internal|github\.internal)/.+$
                    type: string
                  revision:
                    description: |-
                      Revision is the Git revision (commit SHA, branch, or tag) to check out
                      before deploying the chart. Changing this on an existing object
                      triggers a `helm upgrade` (DAT §4.3). Must not start with "-" so it can
                      never be parsed as a git option (argument injection).
                    maxLength: 255
                    pattern: ^[A-Za-z0-9][A-Za-z0-9._/-]*$
                    type: string
                required:
                - chartPath
                - repo
                - revision
                type: object
              ttl:
                description: |-
                  TTL is the time-to-live before automatic teardown, expressed as a
                  duration in whole hours (e.g. "1h", "48h"). Bounded to 168h (7 days)
                  at the schema level (DAT §3.1, §7) — never remove this bound to
                  "simplify" testing; lower it locally with a shorter literal instead.
                pattern: ^[0-9]{1,4}h$
                type: string
                x-kubernetes-validations:
                - message: ttl must not exceed 168h (7 days)
                  rule: duration(self) <= duration('168h')
              valuesOverride:
                description: |-
                  ValuesOverride is a Helm values override applied on top of the chart's
                  own defaults. Must never contain production secrets or credentials
                  (CLAUDE.md, DAT §5) — preview environments only ever get mock/test
                  values here.
                type: object
                x-kubernetes-preserve-unknown-fields: true
            required:
            - appName
            - prNumber
            - source
            - ttl
            type: object
          status:
            description: PreviewEnvironmentStatus defines the observed state of a
              PreviewEnvironment.
            properties:
              cleanupStartedAt:
                description: |-
                  CleanupStartedAt records when finalizer-driven teardown began, used to
                  enforce the cleanup timeout mitigation from DAT §7 (finalizer stuck on
                  a failed Helm uninstall).
                format: date-time
                type: string
              conditions:
                description: |-
                  Conditions represent the latest available observations of this
                  environment's state, keyed by Type (e.g. "Ready").
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              expiresAt:
                description: |-
                  ExpiresAt is the computed expiry time: creationTimestamp + spec.ttl,
                  set once and never recomputed so editing spec.ttl after creation does
                  not retroactively extend an environment already close to expiry.
                format: date-time
                type: string
              helmReleaseName:
                description: HelmReleaseName is the name of the Helm release deployed
                  into Namespace.
                type: string
              namespace:
                description: |-
                  Namespace is the dedicated namespace created for this environment
                  (`preview-pr-<prNumber>-<appName>`, ADR-04).
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the metadata.generation of the spec last
                  successfully deployed; a mismatch (any spec change, e.g.
                  valuesOverride) triggers a `helm upgrade`.
                format: int64
                type: integer
              observedRevision:
                description: |-
                  ObservedRevision is the last spec.source.revision successfully
                  reconciled (installed or upgraded).
                type: string
              phase:
                description: Phase is the current coarse-grained lifecycle phase.
                enum:
                - Pending
                - Provisioning
                - Running
                - Expiring
                - Terminating
                - Failed
                type: string
            type: object
        type: object
        x-kubernetes-validations:
        - message: metadata.name must be at most 53 characters (used as the Helm release
            name)
          rule: self.metadata.name.size() <= 53
    served: true
    storage: true
    subresources:
      status: {}
