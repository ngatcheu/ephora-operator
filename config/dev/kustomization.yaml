# DEV ONLY — local kind cluster. Never apply to a shared or production cluster.
#
# Same CRD as config/crd, with spec.source.repo additionally allowing the
# public helm/examples repository so a real chart can be deployed end-to-end
# without an internal Git host. The allow-list itself is NOT removed: the
# internal hosts stay accepted and every other host is still rejected
# (CLAUDE.md: spec.source.repo restriction is a security control).
#
# Usage: make install-dev
resources:
- ../crd

patches:
- target:
    kind: CustomResourceDefinition
    name: previewenvironments.ephora.io
  patch: |-
    - op: test
      path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/source/properties/repo/pattern
      value: ^https://(gitlab\.internal|github\.internal)/.+$
    - op: replace
      path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/source/properties/repo/pattern
      value: ^https://((gitlab\.internal|github\.internal)/.+|github\.com/helm/examples(\.git)?)$
