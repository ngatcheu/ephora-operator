# Rights of the identity Helm runs as (impersonated ServiceAccount
# "ephora-deployer"), granted PER PREVIEW NAMESPACE by a RoleBinding the
# operator creates — never cluster-wide. The chart comes from the PR author:
# it can only create these kinds, and only in its own namespace.
#
# Kept OUT of config/rbac/role.yaml: that file is regenerated by
# `make manifests` from the +kubebuilder:rbac markers.
#
# Name gets the "ephora-operator-" kustomize prefix: it must match
# DefaultDeployerClusterRole and the `bind` marker in the controller.
#
# Baseline for common charts — widen only for kinds actually used by
# onboarded charts. Deliberately excluded:
#   - ingresses: no network exposure in V1 (ADR-03);
#   - roles/rolebindings: a chart must not be able to grant itself rights.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: ephora-operator
    app.kubernetes.io/managed-by: kustomize
  name: preview-deployer
rules:
- apiGroups:
  - ""
  resources:
  - secrets # Helm release storage (driver "secrets") + chart secrets
  - configmaps
  - services
  - serviceaccounts
  - persistentvolumeclaims
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ""
  resources:
  - pods
  - pods/log
  - endpoints
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  - statefulsets
  - daemonsets
  - replicasets
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - batch
  resources:
  - jobs # Helm hooks are usually Jobs
  - cronjobs
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - autoscaling
  resources:
  - horizontalpodautoscalers
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - policy
  resources:
  - poddisruptionbudgets
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
