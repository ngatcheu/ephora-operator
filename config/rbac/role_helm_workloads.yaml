# Permissions needed to deploy an arbitrary application Helm chart into the
# preview-* namespaces (ADR-01: charts are owned by application teams).
#
# Kept OUT of role.yaml on purpose: role.yaml is regenerated by
# `make manifests` (controller-gen) from the +kubebuilder:rbac markers and
# would silently drop any rule written there by hand.
#
# Baseline for common charts — widen only for kinds actually used by
# onboarded charts. Deliberately excluded:
#   - ingresses: no network exposure in V1 (ADR-03);
#   - roles/rolebindings: granting them would let a chart escalate privileges
#     beyond the operator's own; add explicitly if a chart truly needs RBAC.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: ephora-operator
    app.kubernetes.io/managed-by: kustomize
  name: manager-helm-workloads-role
rules:
- apiGroups:
  - ""
  resources:
  - secrets # Helm release storage (driver "secrets") + chart secrets
  - configmaps
  - services
  - serviceaccounts
  - persistentvolumeclaims
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ""
  resources:
  - pods
  - pods/log
  - endpoints
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  - statefulsets
  - daemonsets
  - replicasets
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - batch
  resources:
  - jobs # Helm hooks are usually Jobs
  - cronjobs
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - autoscaling
  resources:
  - horizontalpodautoscalers
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - policy
  resources:
  - poddisruptionbudgets
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/name: ephora-operator
    app.kubernetes.io/managed-by: kustomize
  name: manager-helm-workloads-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: manager-helm-workloads-role
subjects:
- kind: ServiceAccount
  name: controller-manager
  namespace: system
