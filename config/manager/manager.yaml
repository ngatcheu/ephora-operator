apiVersion: v1
kind: Namespace
metadata:
  name: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: ephora-operator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: ephora-operator
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
  replicas: 1
  template:
    metadata:
      labels:
        control-plane: controller-manager
        # Selected by the metrics Service and the allow-metrics NetworkPolicy.
        app.kubernetes.io/name: ephora-operator
    spec:
      securityContext:
        runAsNonRoot: true
        # Group-owns mounted Secret files (git credentials) so the non-root
        # user (65532, see Dockerfile) can read them with mode 0440.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10
      containers:
      - name: manager
        image: controller:latest
        args:
        - --leader-elect
        - --health-probe-bind-address=:8081
        env: []
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 10m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        # Chart-checkout scratch space (helmchart.go clones into os.TempDir()).
        - name: tmp
          mountPath: /tmp
        # Optional HTTPS token for private chart repositories (gitauth.go).
        - name: git-credentials
          mountPath: /var/run/ephora/git
          readOnly: true
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 1Gi
      - name: git-credentials
        secret:
          # Full name: not managed by kustomize, so not prefixed automatically.
          secretName: ephora-operator-git-credentials
          optional: true # anonymous clones until the Secret is created
          defaultMode: 0440
