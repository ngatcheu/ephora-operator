version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      # k8s.io/*, controller-runtime and Helm must move together.
      kubernetes:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
          - "helm.sh/*"
      # OpenTelemetry modules are versioned in lockstep.
      opentelemetry:
        patterns:
          - "go.opentelemetry.io/*"
      # golang.org/x/* security fixes often span several of them.
      golang-x:
        patterns:
          - "golang.org/x/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
