name: Release

# Pushing a tag vX.Y.Z publishes a signed, scanned, multi-arch image to GHCR
# with its SBOM and build provenance, and a GitHub release carrying an
# install.yaml pinned to the image digest.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    name: Build, scan, sign
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # push to GHCR
      id-token: write      # keyless cosign signing (Sigstore OIDC)
      attestations: write  # GitHub build provenance attestation
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - id: build
        name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Same policy as CI, on the exact pushed artifact: fixable HIGH/CRITICAL
      # block the release before anything is signed or published.
      - name: Trivy scan (blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: SBOM (SPDX)
        uses: anchore/sbom-action@v0.24.2
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - uses: sigstore/cosign-installer@v4.1.2

      # Keyless: the signature binds the image digest to this workflow run's
      # GitHub OIDC identity, recorded in the public Rekor transparency log.
      - name: Sign image and attest SBOM
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$REF"

      - name: GitHub build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.spdx.json

  release:
    name: GitHub release
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: sbom

      # install.yaml references the image by digest, not by tag: what gets
      # deployed is exactly what was scanned and signed.
      - name: Build install.yaml
        env:
          REF: ${{ env.IMAGE }}@${{ needs.image.outputs.digest }}
        run: |
          make kustomize
          # Preinstalled on the runner, or downloaded to ./bin by the Makefile.
          KUSTOMIZE=$(command -v kustomize || echo "$PWD/bin/kustomize")
          mkdir -p dist
          (cd config/manager && "$KUSTOMIZE" edit set image "controller=$REF")
          "$KUSTOMIZE" build config/default > dist/install.yaml
          grep -q "$REF" dist/install.yaml

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REF: ${{ env.IMAGE }}@${{ needs.image.outputs.digest }}
        run: |
          cat > notes.md <<EOF
          ## Installation

          \`\`\`bash
          kubectl apply -f https://github.com/${{ github.repository }}/releases/download/${TAG}/install.yaml
          \`\`\`

          Image : \`${REF}\`

          ## Vérifier la signature

          \`\`\`bash
          cosign verify ${REF} \\
            --certificate-identity-regexp '^https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/v' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          \`\`\`

          Provenance GitHub : \`gh attestation verify oci://${REF} -R ${{ github.repository }}\`
          EOF
          gh release create "$TAG" dist/install.yaml sbom.spdx.json \
            --title "$TAG" --notes-file notes.md --generate-notes --verify-tag
